# Uitleveren (besluit 16-10-2026, levering per klant): zet nieuwe versies van plugin en
# template door naar de leveringsrepo's van elke klant in abonnees.json.
#
#   plugin    een nieuwe versie in plugin.json op main (een release), als tag v<versie>
#   template  elke nieuwe tag stack-v<n> van Stage-Two-AI/app-template-tier2
#
# Wanneer: alleen als er iets nieuws te leveren is, en met de hand.
#   - een merge naar main die plugin.json wijzigt (een nieuwe versie van de plugin) of
#     abonnees.json (een nieuwe abonnee);
#   - met de hand via "Run workflow", na een nieuwe tag stack-v<n> van de template. Een tag in
#     een andere repo kan deze workflow niet starten zonder extra sleutel; daarom hoort het
#     starten bij het uitbrengen van een template-versie (zie README, "Een versie uitbrengen").
#     Wie de template eerst tagt en daarna de nieuwe plugin merget, hoeft niets met de hand:
#     elke run levert ook alle template-tags die de klant nog niet heeft.
# Tot 17-10-2026 draaide hij ook elk uur; dat kostte ongeveer 1.400 Actions-minuten per maand.
# Een versie die de klant al heeft, slaat hij over; een run zonder iets nieuws doet niets.
#
# Schrijven bij de klant gaat via de GitHub App stagetwo-levering, die de klant op alleen
# zijn twee leveringsrepo's installeert. Nodig in deze repo: de variabele LEVERING_APP_ID
# en het geheim LEVERING_APP_PRIVATE_KEY (recept: Stack/docs/recepten/github-app-levering.md).
# Deze workflow, het script en abonnees.json gaan zelf nooit mee naar een klant.
name: Uitleveren

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/plugin.json"
      - "abonnees.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uitleveren
  cancel-in-progress: false

jobs:
  abonnees:
    name: Abonnees
    runs-on: ubuntu-latest
    outputs:
      orgs: ${{ steps.lijst.outputs.orgs }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: lijst
        run: echo "orgs=$(node beheer/uitleveren.mjs --lijst)" >> "$GITHUB_OUTPUT"

  klant:
    name: ${{ matrix.org }}
    needs: abonnees
    if: needs.abonnees.outputs.orgs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.abonnees.outputs.orgs) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Anders gaat het token van deze repo mee met elke git-aanroep naar github.com,
          # ook met de push naar de klant, en wint het van het token van de App.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.LEVERING_APP_ID }}
          private-key: ${{ secrets.LEVERING_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
          repositories: stagetwo-plugin-tier2,app-template-tier2
      # De template van Stage Two, met alle tags. Met een token van dezelfde App, zodat dit
      # blijft werken als de bronrepo is afgeschermd. Vraagt dat de App in Stage-Two-AI op
      # app-template-tier2 staat (Contents: read; recept github-app-levering, deel A).
      - id: bron
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.LEVERING_APP_ID }}
          private-key: ${{ secrets.LEVERING_APP_PRIVATE_KEY }}
          owner: Stage-Two-AI
          repositories: app-template-tier2
      - uses: actions/checkout@v5
        with:
          repository: Stage-Two-AI/app-template-tier2
          token: ${{ steps.bron.outputs.token }}
          path: .bron-template
          fetch-depth: 0
          persist-credentials: false
      - name: Uitleveren
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ matrix.org }}
        run: |
          gh auth setup-git
          node beheer/uitleveren.mjs --org "$ORG" --template "$GITHUB_WORKSPACE/.bron-template"
