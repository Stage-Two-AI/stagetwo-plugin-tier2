# Uitleveren (besluit 16-10-2026, levering per klant): zet nieuwe versies van plugin en
# template door naar de leveringsrepo's van elke klant in abonnees.json.
#
#   plugin    de versie uit toegepast_versie, vanaf de tag v<versie> in deze bronrepo (niet
#             vanaf HEAD van main), bij de klant ook als tag v<versie>
#   template  elke nieuwe tag stack-v<n> van Stage-Two-AI/app-template-tier2, tot en met
#             de tag uit toegepast_template
#
# Wanneer: alleen met de hand ("Run workflow", of gh workflow run uitleveren.yml), nadat Stage
# Two een nieuwe versie op de eigen apps heeft toegepast. Een merge naar main levert dus
# niets aan klanten: dan krijgen alleen de eigen apps van Stage Two de nieuwe versie (zij
# installeren de plugin uit deze bronrepo). Ook een nieuwe abonnee in abonnees.json krijgt
# pas iets na een run met de hand. Elke run levert de pluginversie toegepast_versie (vanaf de
# tag v<versie>) en de template-tags tot en met toegepast_template die de klant nog niet heeft.
# Bij het starten vraagt hij toegepast_versie (de pluginversie) en toegepast_template (de nieuwste
# templatetag, zoals stack-v26) die Stage Two op de eigen apps heeft toegepast. Bestaat de tag
# v<versie> niet in deze bronrepo, heeft plugin.json op die tag een ander versienummer, of is
# de templatetag geen stack-v<n>, dan stopt de run vóór er iets naar een klant gaat (node
# beheer/uitleveren.mjs --toegepast). Een commit na de tag gaat zo nooit mee. Bestaat de tag niet in de
# template, dan stopt de job van elke klant voordat er iets naar die klant gaat. Een nieuwere
# tag dan toegepast_template gaat nooit mee.
# Tot 17-10-2026 draaide hij ook elk uur (ongeveer 1.400 Actions-minuten per maand) en daarna
# vanzelf bij een merge die plugin.json of abonnees.json wijzigde; dat laatste is eraf, zodat
# geen versie bij een klant komt die Stage Two nog niet zelf heeft gebruikt.
# Een versie die de klant al heeft, slaat hij over; een run zonder iets nieuws doet niets.
#
# Schrijven bij de klant gaat via de GitHub App stagetwo-levering, die Stage Two bij de start
# namens de klant installeert op alleen zijn twee leveringsrepo's ("Only select
# repositories"); de klant kan hem altijd zelf verwijderen. Nodig in deze repo: de variabele LEVERING_APP_ID
# en het geheim LEVERING_APP_PRIVATE_KEY (recept: Stack/docs/recepten/github-app-levering.md).
# Het geheim staat in omgeving levering, die alleen main toelaat: een run vanaf een andere
# branch krijgt de sleutel van de App niet.
# Deze workflow, het script en abonnees.json gaan zelf nooit mee naar een klant.
name: Uitleveren

on:
  workflow_dispatch:
    inputs:
      toegepast_versie:
        description: 'Pluginversie: de versie die op de eigen apps van Stage Two is toegepast (bijvoorbeeld 26.0.0); de tag v<versie> moet in deze repo staan'
        required: true
        type: string
      toegepast_template:
        description: 'Nieuwste templatetag: de versie die op de eigen apps van Stage Two is toegepast (bijvoorbeeld stack-v26); nieuwere tags gaan niet mee'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: uitleveren
  cancel-in-progress: false

jobs:
  abonnees:
    name: Abonnees
    runs-on: ubuntu-latest
    outputs:
      orgs: ${{ steps.lijst.outputs.orgs }}
    steps:
      # Met alle tags: de controle leest plugin.json op de tag v<versie>.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Eerst de bevestiging: zonder die gaat er niets naar een klant. De invoer via env,
      # nooit rechtstreeks in het script.
      - name: Versie toegepast op de eigen apps
        env:
          TOEGEPAST: ${{ inputs.toegepast_versie }}
          TOEGEPAST_TEMPLATE: ${{ inputs.toegepast_template }}
        run: |
          if ! uit=$(node beheer/uitleveren.mjs --toegepast "$TOEGEPAST" --toegepast-template "$TOEGEPAST_TEMPLATE" 2>&1); then
            echo "::error::$uit"; exit 1
          fi
          echo "$uit"
      - id: lijst
        run: echo "orgs=$(node beheer/uitleveren.mjs --lijst)" >> "$GITHUB_OUTPUT"

  klant:
    name: ${{ matrix.org }}
    needs: abonnees
    if: needs.abonnees.outputs.orgs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.abonnees.outputs.orgs) }}
    # Hier zit de sleutel van de App; omgeving levering laat alleen main toe.
    environment: levering
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Anders gaat het token van deze repo mee met elke git-aanroep naar github.com,
          # ook met de push naar de klant, en wint het van het token van de App.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.LEVERING_APP_ID }}
          private-key: ${{ secrets.LEVERING_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
          repositories: stagetwo-plugin-tier2,app-template-tier2
      # De template van Stage Two, met alle tags. Met een token van dezelfde App, zodat dit
      # blijft werken als de bronrepo is afgeschermd. Vraagt dat de App in Stage-Two-AI op
      # app-template-tier2 staat (Contents: read; recept github-app-levering, deel A).
      - id: bron
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.LEVERING_APP_ID }}
          private-key: ${{ secrets.LEVERING_APP_PRIVATE_KEY }}
          owner: Stage-Two-AI
          repositories: app-template-tier2
      - uses: actions/checkout@v5
        with:
          repository: Stage-Two-AI/app-template-tier2
          token: ${{ steps.bron.outputs.token }}
          path: .bron-template
          fetch-depth: 0
          persist-credentials: false
      - name: Uitleveren
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ matrix.org }}
          TOEGEPAST: ${{ inputs.toegepast_versie }}
          TOEGEPAST_TEMPLATE: ${{ inputs.toegepast_template }}
        run: |
          gh auth setup-git
          node beheer/uitleveren.mjs --org "$ORG" --toegepast "$TOEGEPAST" --toegepast-template "$TOEGEPAST_TEMPLATE" --template "$GITHUB_WORKSPACE/.bron-template"
